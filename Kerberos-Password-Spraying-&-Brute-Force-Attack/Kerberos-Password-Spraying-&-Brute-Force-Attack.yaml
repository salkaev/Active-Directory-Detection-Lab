title: Brute-Force-Attack
id: 489aaaaf-1098-439a-9045-ffd850bf13a0
status: experimental
description: Detects Brute-Force-Attack.
author: Ilya Salkaev
date: 2026-08-08

logsource:
  product: windows
  service: security

detection:
  selection:
    EventID: 4771

  filter_machine_accounts:
    TargetUserName|re: '.*\$@.*'

  condition: selection and not filter_machine_accounts

falsepositives:
  - Normal authentication
  - Administrative tools
  - Password change in accordance with policy

level: low

tags:
  - Password Spraying
  - attack.T1110.003